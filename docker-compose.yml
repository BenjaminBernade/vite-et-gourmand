services:

  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - mongo
    env_file:
      - .env

    command: sh -c "npx prisma db push && npm start"

  postgres:
    image: postgres:16
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vitegourmand

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  mongo:
    image: mongo:7

    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

volumes:
  postgres-data:
  mongo-data: